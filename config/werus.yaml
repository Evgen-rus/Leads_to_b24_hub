code: werus
name: Werus
enabled: false

google:
  spreadsheet_id_env: WERUS_GOOGLE_SHEET_ID
  sheet_name_env: WERUS_GOOGLE_SHEET_NAME
  result_header: Статус_Б24

bitrix:
  webhook_env: WERUS_BITRIX_WEBHOOK_URL
  fields:
    TITLE: {template: "Перехват лидов {date_ddmmyyyy}"}
    PHONE: {phone: true, value_type: MOBILE}
    SOURCE_ID: {env: WERUS_BITRIX_SOURCE_ID}
    STATUS_ID: {env: WERUS_BITRIX_STATUS_ID}
    COMMENTS: {from: source_lead, omit_if_empty: true}

assignment:
  members:
    - env: WERUS_BITRIX_ASSIGNED_BY_ID
