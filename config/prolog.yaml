code: prolog
name: Prolog
enabled: true

google:
  spreadsheet_id_env: PROLOG_GOOGLE_SHEET_ID
  sheet_name_env: PROLOG_GOOGLE_SHEET_NAME
  result_header: Статус_Б24

bitrix:
  webhook_env: PROLOG_BITRIX_WEBHOOK_URL
  fields:
    TITLE: {template: "Перехват лидов {date_ddmmyyyy}"}
    PHONE: {phone: true, value_type: MOBILE}
    SOURCE_ID: {env: PROLOG_BITRIX_SOURCE_ID, default: LR_PARSING}
    STATUS_ID: {env: PROLOG_BITRIX_STATUS_ID, default: NEW}
    COMMENTS: {from: source_lead, omit_if_empty: true}

assignment:
  members:
    - env: PROLOG_BITRIX_ASSIGNED_BY_ID
      default: "116"
